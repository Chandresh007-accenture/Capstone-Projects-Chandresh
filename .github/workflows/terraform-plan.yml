
name: Project 12 - Terraform Plan

on:
  push:
    branches:
      - main
      - 'feature/Project-12-Infrastructure-CI-Trigger-Terraform-Plan'
    paths:
      - 'Project-12-Infrastructure-CI-Trigger-Terraform-Plan/**'
      - '.github/workflows/terraform-plan.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Project-12-Infrastructure-CI-Trigger-Terraform-Plan/**'
      - '.github/workflows/terraform-plan.yml'

jobs:
  terraform-plan:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Project-12-Infrastructure-CI-Trigger-Terraform-Plan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Initialize
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-12-terraform-plan
          path: Project-12-Infrastructure-CI-Trigger-Terraform-Plan/tfplan
          if-no-files-found: error
          retention-days: 7
