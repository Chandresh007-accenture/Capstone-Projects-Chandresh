---
- name: Configure Apache Web Server
  hosts: localhost
  connection: local
  become: true

  tasks:
    - name: Update apt package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Apache web server
      ansible.builtin.apt:
        name: apache2
        state: present

    - name: Start and enable Apache
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true

    - name: Deploy custom website
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head>
              <title>Project 15 - Chandresh</title>
          </head>
          <body>
              <h1>Apache Deployment Successful!</h1>
              <h2>Automated using Ansible</h2>
              <p>Project: Automate Server Configuration with Ansible</p>
              <p>Managed Node: ansible-p15-managed-Chandresh</p>
              <p>Owner: Chandresh</p>
          </body>
          </html>
        owner: www-data
        group: www-data
        mode: '0644'
