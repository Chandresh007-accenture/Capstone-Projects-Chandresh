
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandresh | AWS S3 Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 50px 30px;
            max-width: 750px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 20px;
            color: #dbeafe;
        }

        .badge {
            display: inline-block;
            background: #ff9900;
            color: #141e30;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            margin: 15px 0;
        }

        footer {
            margin-top: 35px;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Welcome to My AWS Website!</h1>

        <p>
            Hello, I'm <strong>Chandresh Kumar</strong>.
        </p>

        <p>
            This static website is hosted on
            Amazon S3 using Terraform.
        </p>

        <div class="badge">
            AWS S3 + Terraform
        </div>

        <p>
            Successfully deployed my second AWS
            Cloud Infrastructure Project!
        </p>

        <footer>
            Project 2 | Static Website Hosting | 2026
        </footer>

    </div>
</body>
</html>
