name: GitOps Infrastructure Deployment

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'Project-18-GitOps-Infra-Deployment/**'

permissions:
  contents: read

jobs:
  terraform-plan:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Project-18-GitOps-Infra-Deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Initialize
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: Project-18-GitOps-Infra-Deployment/tfplan

  terraform-apply:
    if: github.event.pull_request.merged == true
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: Project-18-GitOps-Infra-Deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Initialize
        run: terraform init -backend=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: Project-18-GitOps-Infra-Deployment

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
